# Render Blueprint — provisions the Socket.io/Express server + a Postgres DB.
# In Render: New + → Blueprint → pick this repo. Set CLIENT_ORIGIN after the
# Vercel web app is deployed (its URL).
services:
  - type: web
    name: chess-server
    runtime: node
    plan: free
    region: oregon
    # Install all workspaces, then generate the Prisma client.
    buildCommand: npm install && npm -w @chess/server run db:generate
    # Sync the schema to the DB on each deploy, then boot the server.
    startCommand: npm -w @chess/server exec prisma db push --skip-generate && npm -w @chess/server run start
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false # set to your Vercel URL, e.g. https://your-app.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: chess-db
          property: connectionString

databases:
  - name: chess-db
    plan: free
    region: oregon
